name: API CI CD pipeline
on:
  push:
    branches:
      - main
    paths: 
      - 'services/api-spring/**'
jobs:
  compile:
    runs-on: ubuntu-latest
    name: Compile api
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with: 
          sparse-checkout: |
            .github
            services/api-spring
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Give execute permission to mvnw
        working-directory: ./services/api-spring
        run: chmod +x mvnw
      - name: Compile project
        working-directory: ./services/api-spring
        run: ./mvnw clean compile
  test:
    runs-on: ubuntu-latest
    name: Test api
    needs: [compile]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with: 
          sparse-checkout: |
            .github
            services/api-spring
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Give execute permission to mvnw
        working-directory: ./services/api-spring
        run: chmod +x mvnw
      - name: Compile project
        working-directory: ./services/api-spring
        run: ./mvnw clean test
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: services/api-spring/target/surefire-reports
