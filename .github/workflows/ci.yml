name: Blog-api-net CI
on:
  push:
    branches:
      - main
    paths:
      - 'services/api/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api/Blog-Api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: services/api
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build with dotnet
        run: dotnet build --configuration Release
      - name: Run tests
        run: dotnet test --configuration Release

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: dokploy-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger Dokploy deploy
        run: |
          curl -fsS -X POST "https://dokploy.asanchez1816.cloud/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -d '{"composeId": "${{ secrets.DOKPLOY_API_COMPOSE_ID }}"}'

      - name: Wait for Dokploy deployment to finish
        run: |
          for i in $(seq 1 30); do
            status=$(curl -fsS "https://dokploy.asanchez1816.cloud/api/compose.one?composeId=${{ secrets.DOKPLOY_API_COMPOSE_ID }}" \
              -H "accept: application/json" \
              -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" | jq -r '.composeStatus')
            echo "Compose status: $status"
            if [ "$status" = "done" ]; then
              exit 0
            fi
            if [ "$status" = "error" ]; then
              echo "Dokploy reported a failed deployment"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deployment to finish"
          exit 1

      - name: Smoke test deployed API
        run: curl -fsS "https://api.blogapinet.asanchez1816.cloud/health" > /dev/null
