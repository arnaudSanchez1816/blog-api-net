#Server
spring.application.name=api-spring
spring.mvc.problemdetails.enabled=true
#Profile
spring.profiles.active=test,postgres
#Security
blog-api.security.enable=true
blog-api.security.cors-allowed-urls=*
#Logging
#logging.level.root=DEBUG
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
#Secret
blog-api.security.jwt.access-secret=${JWT_ACCESS_SECRET:jwt_access_secret}
blog-api.security.jwt.refresh-secret=${JWT_REFRESH_SECRET:jwt_refresh_secret}
#AWS
# Dummy values so the auto-configured S3 client can be built in full-context tests.
# Replaced with Floci container when a test use the FlociS3TestConfig
spring.cloud.aws.s3.region=us-east-1
blog-api.aws.s3.bucket-name=test-bucket
# No need to check the bucket in tests since we give dummy values
blog-api.aws.s3.verify-bucket-on-startup=false